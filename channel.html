<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Local TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>

        :root {
            --primary-bg: #000000;
            --overlay-dark: rgba(15, 15, 15, 0.85);
            --accent-color: #cc0000;
            --text-light: #ffffff;
            --font-main: 'Roboto', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--primary-bg); width: 100vw; height: 100vh; 
            display: flex; justify-content: center; align-items: center;
            font-family: var(--font-main); overflow: hidden !important; touch-action: none; 
        }

        main { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }

        .player-wrapper {
            position: relative; width: 100%; height: 100%;
            max-width: calc(100vh * (16 / 9)); max-height: calc(100vw * (9 / 16));
            background-color: #000; 
            overflow: hidden; 
            aspect-ratio: 16 / 9;
        }

        .player-wrapper iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 1; pointer-events: none;
        }


        #top-image-slider {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 10%; 
            max-height: 75px; 
            z-index: 50; 
            border-bottom: 2px solid var(--accent-color);
            background-color: #000;
            overflow: hidden;
        }

        #top-image-slider img {
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            opacity: 0; 
            animation: fadeInOut 10s infinite;
        }

        @keyframes fadeInOut { 0%, 5% { opacity: 0; } 15%, 85% { opacity: 1; } 95%, 100% { opacity: 0; } }

        /* --- 2. Logos --- */
        #logo {
            position: absolute; top: 12%; right: 20px; z-index: 10; width: 140px; height: auto; max-height: 100px; object-fit: contain;
        }

        #logo1 {
display: none !important;
            position: absolute; top: 12%; left: 20px; width: auto; height: 80px; object-fit: contain; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5)); z-index: 10;
        }


        .news-broadcaster-container {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 20; display: flex; align-items: flex-end;
        }

        .news-left-sidebar { display: flex; flex-direction: column; width: 160px; flex-shrink: 0; box-shadow: 2px 0 10px rgba(0,0,0,0.5); z-index: 22; }
        .news-tickers { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; background-color: #ffffff; }

        /* Clock */
        #clock-container {
            background-color: #0044cc; color: #ffffff; display: flex; justify-content: center; align-items: center;
            height: 35px; padding: 4px; border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; border-right: 2px solid #ffffff; white-space: nowrap; overflow: hidden;
        }
        #display { font-size: clamp(12px, 1.2vw, 16px); font-weight: 900; letter-spacing: 0.5px; transition: opacity 0.5s ease-in-out; }


        .breaking-box { 
            text-align: center; height: 56px; display: flex; flex-direction: column; justify-content: center;
            border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; border-right: 2px solid #ffffff;
        }
        .breaking-text { background-color: #cc0000; color: #ffffff; font-weight: 900; font-size: 16px; padding: 2px 0; letter-spacing: 1px; }
        .news-text { background-color: #ffffff; color: #000000; font-weight: 900; font-size: 18px; padding: 2px 0; letter-spacing: 2px; }
        
        .ticker-slider { 
            background-color: #cc0000; color: #ffffff; height: 56px; display: flex; align-items: center; padding: 0 20px; font-size: 24px; font-weight: 900; 
            border-top: 2px solid #ffffff; white-space: nowrap; overflow: hidden; 
        }


        .apts-box {
            background-color: #ffff00; color: #000000; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center; text-align: center; height: 48px; 
            border-top: 4px solid #cc0000; border-bottom: 2px solid #cc0000; border-left: 2px solid #ffffff; border-right: 2px solid #ffffff;
        }
        .ticker-main { 
            background-color: #1313e8; height: 48px; display: flex; align-items: center; 
            border-top: 4px solid #cc0000; border-bottom: 2px solid #cc0000; 
        }
        .marquee { color: #ffffff; font-size: 26px; font-weight: 900; }


        .advt-box { 
            background-color: #cc0000; color: #ffffff; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; height: 28px; 
            border-bottom: 4px solid #cc0000; border-left: 2px solid #ffffff; border-right: 2px solid #ffffff; 
        }
        .ticker-sub { 
            background-color: #e6e6e6; height: 28px; display: flex; align-items: center; 
            border-bottom: 4px solid #cc0000; 
        }
        .marquee-sub { color: #333333; font-size: 16px; font-weight: bold; }


        @media (max-width: 768px) {
            #top-image-slider { height: 10%; min-height: 30px; border-bottom: 1px solid var(--accent-color); }
            #logo { top: 12%; right: 10px; width: 60px; max-height: 40px; }
            #logo1 { top: 12%; left: 10px; height: 35px; }
            .news-left-sidebar { width: 70px; } 
            
            #clock-container { height: 20px; padding: 2px; border: 1px solid #ffffff; border-bottom: none;}
            #display { font-size: 9px; letter-spacing: 0; }
            
            .breaking-box { height: 30px; border-top: 1px solid #ffffff; border-left: 1px solid #ffffff; border-right: 1px solid #ffffff; } 
            .ticker-slider { height: 30px; font-size: 8px; padding: 0 5px; border-top: 1px solid #ffffff;}
            .breaking-text { font-size: 8px; padding: 1px 0; } .news-text { font-size: 9px; padding: 0;}
            
            .apts-box { height: 26px; font-size: 9px; border-top: 2px solid #cc0000; border-bottom: 1px solid #cc0000; border-left: 1px solid #ffffff; border-right: 1px solid #ffffff; } 
            .ticker-main { height: 26px; border-top: 2px solid #cc0000; border-bottom: 1px solid #cc0000; } 
            .marquee { font-size: 10px; }

            .advt-box { height: 16px; font-size: 8px; border-bottom: 2px solid #cc0000; border-left: 1px solid #ffffff; border-right: 1px solid #ffffff; }
            .ticker-sub { height: 16px; border-bottom: 2px solid #cc0000;} 
            .marquee-sub { font-size: 10px; }
        }

        @media (max-width: 950px) and (orientation: landscape) {
            #top-image-slider { height: 10%; max-height: 40px; border-bottom: 1px solid var(--accent-color); }
            #logo { top: 12%; right: 10px; width: 80px; max-height: 45px;}
            #logo1 { top: 12%; left: 10px; height: 40px; }
            .news-left-sidebar { width: 85px; }

            #clock-container { height: 22px; padding: 2px; border: 1px solid #ffffff; border-bottom: none;}
            #display { font-size: 10px; }
            
            .breaking-box { height: 34px; border-top: 1px solid #ffffff; border-left: 1px solid #ffffff; border-right: 1px solid #ffffff; } 
            .ticker-slider { height: 34px; font-size: 14px; padding: 0 8px; border-top: 1px solid #ffffff; }
            .breaking-text { font-size: 9px; padding: 1px 0; } .news-text { font-size: 11px; padding: 0;}
            
            .apts-box { height: 28px; font-size: 10px; border-top: 2px solid #cc0000; border-bottom: 1px solid #cc0000; border-left: 1px solid #ffffff; border-right: 1px solid #ffffff; } 
            .ticker-main { height: 28px; border-top: 2px solid #cc0000; border-bottom: 1px solid #cc0000; } 
            .marquee { font-size: 12px; }

            .advt-box { height: 18px; font-size: 9px; border-bottom: 2px solid #cc0000; border-left: 1px solid #ffffff; border-right: 1px solid #ffffff; }
            .ticker-sub { height: 18px; border-bottom: 2px solid #cc0000;} 
            .marquee-sub { font-size: 11px; }
        }
    </style>
</head>
<body>

    <main>
        <section class="player-wrapper">
            <iframe id="video-player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            
            <div id="top-image-slider"><img id="top-slide-img" src="" alt="Promo" /></div>
            
            <img id="logo" src="logo.png" alt="Channel Logo" onerror="this.style.display='none'" />
            <img id="logo1" src="news.png" alt="News Logo" onerror="this.style.display='none'" />

            <div class="news-broadcaster-container">
                <div class="news-left-sidebar">
                    <div id="clock-container"><div id="display"></div></div>
                    
                    <div class="breaking-box"><div id="banner-text" class="breaking-text">BREAKING</div><div class="news-text">NEWS</div></div>
                    <div class="apts-box">NEWS</div>
                    <div class="advt-box">ADVT</div>
                </div>
                
                <div class="news-tickers">
                    <div class="ticker-slider"><div id="slider-text-display">Loading updates...</div></div>
                    <div class="ticker-main"><marquee class="marquee" scrollamount="10" loop="true"></marquee></div>
                    <div class="ticker-sub"><marquee class="marquee-sub" scrollamount="5" loop="true"></marquee></div>
                </div>
            </div>
        </section>
    </main>

    <script>

        const supabaseUrl = 'https://jehffxxhrqwnzhkrcbrv.supabase.co';
        const supabaseKey = 'sb_publishable_R-ik0luMifvjFakpfDr3cA_8kIGVVQP';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        const OPERATOR_CODE = urlParams.get('code') || urlParams.get('c');

        if (!OPERATOR_CODE) {
            document.body.innerHTML = `
                <div style="display:flex; justify-content:center; align-items:center; height:100vh; background:#000; color:#fff; font-family:sans-serif;">
                    <div style="text-align:center;">
                        <h1 style="color:#ff4444;">CHANNEL NOT FOUND</h1>
                    </div>
                </div>
            `;
            throw new Error("No Operator Code Provided");
        }

        let data = { urlPlaylist: [], aptsText: [], advtText: [], sliderText: [], sliderPlaylist: [], settings: null };
        let currentVideoIndex = -1; let syncIndex = 0; let syncInterval = null; let imageSlideIndex = 0; let imageSliderInterval = null;

        function startSynchronizedSliders() {
            if (syncInterval) clearInterval(syncInterval);
            updateSyncedText(); syncInterval = setInterval(updateSyncedText, 10000); 
        }

        function updateSyncedText() {
            if (!data.sliderText || data.sliderText.length === 0) return;
            const currentText = data.sliderText[syncIndex % data.sliderText.length].text;
            let bannerWord = "BREAKING"; const u = currentText.toUpperCase();
            if (u.includes("ALERT")) bannerWord = "ALERT"; else if (u.includes("UPDATE")) bannerWord = "UPDATES"; else if (u.includes("LATEST")) bannerWord = "LATEST";
            const bannerEl = document.getElementById('banner-text'); if (bannerEl) bannerEl.textContent = bannerWord;
            const sliderDisplay = document.getElementById('slider-text-display'); if (sliderDisplay) sliderDisplay.textContent = currentText;
            syncIndex++;
        }

        function startImageSlider() {
            const sliderImg = document.getElementById('top-slide-img'); const sliderContainer = document.getElementById('top-image-slider');
            if (!sliderImg || !sliderContainer) return;
            if (!data.sliderPlaylist || data.sliderPlaylist.length === 0) { sliderContainer.style.display = 'none'; return; }
            sliderContainer.style.display = data.settings && !data.settings.show_promo ? 'none' : 'block';
            if (imageSliderInterval) clearInterval(imageSliderInterval);
            imageSlideIndex = 0;
            const updateImage = () => {
                sliderImg.src = data.sliderPlaylist[imageSlideIndex].image;
                sliderImg.style.animation = 'none'; sliderImg.offsetHeight; sliderImg.style.animation = 'fadeInOut 10s infinite';
                imageSlideIndex = (imageSlideIndex + 1) % data.sliderPlaylist.length;
            };
            updateImage(); imageSliderInterval = setInterval(updateImage, 10000); 
        }

        function applyOverlaySettings() {
            if (!data.settings) return;
            const s = data.settings;
            const logoNews = document.getElementById('logo1'); if(logoNews) { if(s.logo_news_url) logoNews.src = s.logo_news_url; logoNews.style.display = s.show_logo_news ? 'block' : 'none'; }
            const logoChannel = document.getElementById('logo'); if(logoChannel) { if(s.logo_channel_url) logoChannel.src = s.logo_channel_url; logoChannel.style.display = s.show_logo_channel ? 'block' : 'none'; }
            const clock = document.getElementById('clock-container'); if(clock) clock.style.display = s.show_clock ? 'flex' : 'none';
            const promoSlider = document.getElementById('top-image-slider'); if(promoSlider && data.sliderPlaylist.length > 0) promoSlider.style.display = s.show_promo ? 'block' : 'none';
            const breakingBox = document.querySelector('.breaking-box'); const tickerSlider = document.querySelector('.ticker-slider');
            if(breakingBox) breakingBox.style.display = s.show_breaking ? 'flex' : 'none'; if(tickerSlider) tickerSlider.style.display = s.show_breaking ? 'flex' : 'none';
            const aptsBox = document.querySelector('.apts-box'); const tickerMain = document.querySelector('.ticker-main');
            if(aptsBox) aptsBox.style.display = s.show_apts ? 'flex' : 'none'; if(tickerMain) tickerMain.style.display = s.show_apts ? 'flex' : 'none';
            const advtBox = document.querySelector('.advt-box'); const tickerSub = document.querySelector('.ticker-sub');
            if(advtBox) advtBox.style.display = s.show_advt ? 'flex' : 'none'; if(tickerSub) tickerSub.style.display = s.show_advt ? 'flex' : 'none';
        }

        async function loadPlaylist() {
            try {
                const [urlsRes, aptsRes, advtRes, sliderRes, imgSliderRes, settingsRes, opRes] = await Promise.all([
                    db.from('url_playlist').select('*').eq('operator_code', OPERATOR_CODE).order('id', { ascending: true }),
                    db.from('apts_text').select('*').eq('operator_code', OPERATOR_CODE).order('id', { ascending: true }), 
                    db.from('advt_text').select('*').eq('operator_code', OPERATOR_CODE).order('id', { ascending: true }),
                    db.from('slider_text').select('*').eq('operator_code', OPERATOR_CODE).order('id', { ascending: true }),
                    db.from('slider_playlist').select('*').eq('operator_code', OPERATOR_CODE).order('id', { ascending: true }),
                    db.from('overlay_settings').select('*').eq('operator_code', OPERATOR_CODE).maybeSingle(),
                    db.from('operators').select('*').eq('code', OPERATOR_CODE).maybeSingle()
                ]);

                if (!opRes.data || new Date(opRes.data.expires_at) < new Date()) {
                    document.body.innerHTML = `
                        <div style="display:flex; justify-content:center; align-items:center; height:100vh; background:#000; color:#fff; font-family:sans-serif;">
                            <div style="text-align:center;"><h1 style="color:#ff4444;">CHANNEL OFFLINE</h1><p style="color:#aaa;">This broadcast is temporarily unavailable.</p></div>
                        </div>`;
                    return;
                }

                data.urlPlaylist = urlsRes.data || []; data.aptsText = aptsRes.data || []; data.advtText = advtRes.data || [];
                data.sliderText = sliderRes.data || []; data.sliderPlaylist = imgSliderRes.data || []; data.settings = settingsRes.data || null;
                updateMarquees(); startImageSlider(); startSynchronizedSliders(); applyOverlaySettings(); scheduleVideo(); 
            } catch (err) { console.error('Failed to load data:', err); }
        }

        function updateMarquees() {
            const mainMarquee = document.querySelector('.marquee');
            if (mainMarquee && data.aptsText.length > 0) { let m = ''; data.aptsText.forEach(item => { m += item.text + " \u00A0\u00A0\u00A0•\u00A0\u00A0\u00A0 "; }); mainMarquee.textContent = m; }
            const subMarquee = document.querySelector('.marquee-sub');
            if (subMarquee && data.advtText.length > 0) { let s = ''; data.advtText.forEach(item => { s += item.text + " \u00A0\u00A0\u00A0•\u00A0\u00A0\u00A0 "; }); subMarquee.textContent = s; }
        }

        function timeToSec(t) { if (!t) return 0; const [h, m, s] = t.split(':').map(Number); return (h * 3600) + (m * 60) + s; }

        function scheduleVideo() {
            if (!data.urlPlaylist || data.urlPlaylist.length === 0) return;
            const currentSec = timeToSec(new Date().toTimeString().slice(0, 8)); 
            let matchedIndex = -1; let offsetSeconds = 0; 
            for (let i = 0; i < data.urlPlaylist.length; i++) {
                const item = data.urlPlaylist[i]; const startSec = timeToSec(item.start); const endSec = timeToSec(item.end);
                if (startSec <= endSec) {
                    if (currentSec >= startSec && currentSec < endSec) { matchedIndex = i; offsetSeconds = currentSec - startSec; break; }
                } else {
                    if (currentSec >= startSec || currentSec < endSec) { matchedIndex = i; offsetSeconds = currentSec >= startSec ? currentSec - startSec : (currentSec + 86400) - startSec; break; }
                }
            }
            if (matchedIndex !== -1 && matchedIndex !== currentVideoIndex) {
                currentVideoIndex = matchedIndex; const videoUrl = data.urlPlaylist[matchedIndex].url; let fullUrl = videoUrl;
                const sep = videoUrl.includes('?') ? '&' : '?';
                if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) fullUrl += `${sep}autoplay=1&start=${offsetSeconds}`;
                else fullUrl += `${sep}autoplay=1#t=${offsetSeconds}`;
                const player = document.getElementById('video-player'); if (player) player.src = fullUrl;
            }
        }

        let isShowingDate = false;
        function updateDisplay() {
            const displayElement = document.getElementById('display'); if (!displayElement) return;
            displayElement.style.opacity = 0;
            setTimeout(() => {
                const now = new Date();
                if (isShowingDate) {
                    let hours = now.getHours(); const minutes = String(now.getMinutes()).padStart(2, '0');
                    displayElement.textContent = `${hours % 12 || 12}:${minutes} ${hours >= 12 ? 'PM' : 'AM'}`; 
                } else {
                    displayElement.textContent = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()}`;
                }
                isShowingDate = !isShowingDate; displayElement.style.opacity = 1;
            }, 500); 
        }

        async function init() {
            if (document.getElementById('display')) document.getElementById('display').textContent = "00:00 AM";
            updateDisplay(); setInterval(updateDisplay, 8000); 
            await loadPlaylist(); setInterval(loadPlaylist, 5 * 60 * 1000); setInterval(scheduleVideo, 1000); 
        }

        $(window).on('dblclick', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); });
        window.onload = init;
    </script>
</body>
</html>
