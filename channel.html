<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Local TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        :root {
            --primary-bg: #000000;
            --overlay-dark: rgba(15, 15, 15, 0.85);
            --accent-color: #cc0000;
            --text-light: #ffffff;
            --font-main: 'Roboto', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--primary-bg); width: 100vw; height: 100vh; 
            display: flex; justify-content: center; align-items: center;
            font-family: var(--font-main); overflow: hidden !important; touch-action: none; 
        }

        main { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }

        .player-wrapper {
            position: relative; width: 100%; height: 100%;
            max-width: calc(100vh * (16 / 9)); max-height: calc(100vw * (9 / 16));
            background-color: #000; 
            overflow: hidden; 
            aspect-ratio: 16 / 9;
        }

        .player-wrapper iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 1; pointer-events: none;
        }

        #overlay-scaler {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            transform-origin: top left;
            pointer-events: none;
            z-index: 10;
        }

        #top-image-slider {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 160px; 
            z-index: 50; 
            border-bottom: 4px solid var(--accent-color);
            background-color: #000;
            overflow: hidden;
        }

        #top-image-slider img {
            width: 100%; 
            height: 100%; 
            display: block; 
            opacity: 0; 
            animation: fadeInOut 10s infinite;
        }

        @keyframes fadeInOut { 0%, 5% { opacity: 0; } 15%, 85% { opacity: 1; } 95%, 100% { opacity: 0; } }

        /* --- Logos --- */
        #logo { position: absolute; top: 190px; right: 40px; z-index: 10; width: 250px; height: auto; max-height: 180px; object-fit: contain; }
        #logo1 { position: absolute; top: 190px; left: 40px; width: auto; height: 160px; object-fit: contain; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5)); z-index: 10; display: none; }

        /* --- ROW CONTAINERS --- */
        .news-broadcaster-container {
            position: absolute; bottom: 0; left: 0; width: 1920px; height: 1080px; z-index: 20; 
        }

        .news-row { 
            position: absolute; left: 0; width: 100%; display: flex; 
        }

        #row-advt { bottom: 0; height: 60px; }
        #row-apts { bottom: 60px; height: 80px; }
        #row-breaking { bottom: 140px; height: 110px; } 

        .row-left { 
            display: flex; flex-direction: column; width: 280px; flex-shrink: 0; 
            box-shadow: 3px 0 15px rgba(0,0,0,0.6); z-index: 22; background-color: transparent;
        }

        .row-right { 
            display: flex; flex-direction: column; flex-grow: 1; min-width: 0; width: 100%;
            overflow: hidden; background-color: #ffffff; 
        }

        /* --- REDESIGNED ROW 1 (BREAKING + CLOCK) --- */
        .ticker-slider-container {
            display: flex; flex-direction: row; width: 100%; height: 110px; 
            background-color: #cc0000; border-top: 4px solid #ffffff;
        }

        .ticker-slider { 
            flex-grow: 1; display: flex; align-items: center; padding: 0 30px; 
            color: #ffffff; white-space: nowrap; overflow: hidden; 
            justify-content: center; 
            text-align: center;
        }

        #clock-container {
            background-color: #9400D3; 
            color: #ffffff; display: flex; justify-content: center; align-items: center;
            padding: 0 40px; border-left: 4px solid #ffffff; white-space: nowrap; overflow: hidden; flex-shrink: 0;
        }
        
        #display { font-size: 38px; font-weight: 900; letter-spacing: 1px; transition: opacity 0.5s ease-in-out; }

        .breaking-box { 
            text-align: center; height: 110px; 
            display: flex; flex-direction: column; justify-content: center;
            border-top: 4px solid #ffffff; border-left: 4px solid #ffffff; border-right: 4px solid #ffffff;
        }
        
        .breaking-text { background-color: #cc0000; color: #ffffff; font-weight: 900; font-size: 28px; padding: 8px 0; letter-spacing: 1px; animation: boxFlash 1s infinite alternate; }
        .news-text { background-color: #ffffff; color: #000000; font-weight: 900; font-size: 36px; padding: 8px 0; letter-spacing: 2px; }
        
        @keyframes boxFlash { 0% { background-color: #cc0000; color: #ffffff; } 100% { background-color: #ffffff; color: #cc0000; } }

        /* DECREASED FONT SIZES FOR BREAKING TEXT TO FIT TELUGU CHARACTERS */
        .breaking-intro { display: none; width: 100%; text-align: center; font-size: 60px; font-weight: 900; color: #ffffff; letter-spacing: 2px; animation: introFlash 1s infinite alternate; }
        .slider-text { display: none; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; font-size: 35px; font-weight: 900; }

        @keyframes introFlash { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 1; transform: scale(1.02); } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Row 2 */
        .apts-box { background-color: #ffff00; color: #000000; font-size: 32px; font-weight: 900; display: flex; align-items: center; justify-content: center; text-align: center; height: 80px; border-top: 5px solid #cc0000; border-bottom: 3px solid #cc0000; border-left: 3px solid #ffffff; border-right: 3px solid #ffffff; }
        .ticker-main { background-color: #1313e8; height: 80px; display: flex; align-items: center; width: 100%; border-top: 5px solid #cc0000; border-bottom: 3px solid #cc0000; }
        /* DECREASED FONT SIZE FOR MAIN NEWS SCROLL */
        .marquee { color: #ffffff; font-size: 34px; font-weight: 900; }

        /* Row 3 */
        .advt-box { background-color: #cc0000; color: #ffffff; font-size: 26px; font-weight: bold; display: flex; align-items: center; justify-content: center; height: 60px; border-bottom: 5px solid #cc0000; border-left: 3px solid #ffffff; border-right: 3px solid #ffffff; }
        .ticker-sub { background-color: #e6e6e6; height: 60px; display: flex; align-items: center; width: 100%; border-bottom: 5px solid #cc0000; }
        /* DECREASED FONT SIZE FOR ADVT SCROLL */
        .marquee-sub { color: #000000; font-size: 24px; font-weight: 900; }
    </style>
</head>
<body>

    <main>
        <section class="player-wrapper">
            <iframe id="video-player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            
            <div id="overlay-scaler">
                <div id="top-image-slider"><img id="top-slide-img" src="" alt="Promo" /></div>
                
                <img id="logo" src="logo.png" alt="Channel Logo" onerror="this.style.display='none'" />
                <img id="logo1" src="news.png" alt="News Logo" onerror="this.style.display='none'" />

                <div class="news-broadcaster-container">
                    
                    <!-- ROW 1: BREAKING NEWS + CLOCK -->
                    <div class="news-row" id="row-breaking">
                        <div class="row-left">
                            <div class="breaking-box"><div id="banner-text" class="breaking-text">BREAKING</div><div class="news-text">NEWS</div></div>
                        </div>
                        <div class="row-right">
                            <div class="ticker-slider-container">
                                <div class="ticker-slider">
                                    <div id="breaking-intro" class="breaking-intro">&#128680; BREAKING NEWS &#128680;</div>
                                    <div id="slider-text-display" class="slider-text"></div>
                                </div>
                                <div id="clock-container"><div id="display"></div></div>
                            </div>
                        </div>
                    </div>

                    <!-- ROW 2: APTS NEWS -->
                    <div class="news-row" id="row-apts">
                        <div class="row-left">
                            <div class="apts-box">NEWS</div>
                        </div>
                        <div class="row-right">
                            <div class="ticker-main"><marquee class="marquee" scrollamount="10" loop="true"></marquee></div>
                        </div>
                    </div>

                    <!-- ROW 3: ADVT -->
                    <div class="news-row" id="row-advt">
                        <div class="row-left">
                            <div class="advt-box">ADVT</div>
                        </div>
                        <div class="row-right">
                            <div class="ticker-sub"><marquee class="marquee-sub" scrollamount="5" loop="true"></marquee></div>
                        </div>
                    </div>
                    
                </div>
            </div>
        </section>
    </main>

    <script>
        const supabaseUrl = 'https://jehffxxhrqwnzhkrcbrv.supabase.co';
        const supabaseKey = 'sb_publishable_R-ik0luMifvjFakpfDr3cA_8kIGVVQP';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        const OPERATOR_CODE = urlParams.get('code') || urlParams.get('c');

        if (!OPERATOR_CODE) {
            document.body.innerHTML = `<div style="display:flex; justify-content:center; align-items:center; height:100vh; background:#000; color:#fff; font-family:sans-serif;"><div style="text-align:center;"><h1 style="color:#ff4444;">CHANNEL NOT FOUND</h1></div></div>`;
            throw new Error("No Operator Code Provided");
        }

        let data = { urlPlaylist: [], aptsText: [], advtText: [], sliderText: [], sliderPlaylist: [], settings: null };
        let currentVideoIndex = -1; let syncIndex = 0; let syncInterval = null; let imageSlideIndex = 0; let imageSliderInterval = null;
        let breakTimeout1, breakTimeout2; 

        function startSynchronizedSliders() {
            if (syncInterval) clearInterval(syncInterval);
            updateSyncedText(); syncInterval = setInterval(updateSyncedText, 10000); 
        }

        function updateSyncedText() {
            if (!data.sliderText || data.sliderText.length === 0) return;
            const currentText = data.sliderText[syncIndex % data.sliderText.length].text;
            syncIndex++;

            const introEl = document.getElementById('breaking-intro');
            const textEl = document.getElementById('slider-text-display');

            clearTimeout(breakTimeout1);
            clearTimeout(breakTimeout2);

            introEl.style.display = 'block';
            textEl.style.display = 'none';

            let chunks = [];
            const MAX_LEN = 140; 
            if (currentText.length > MAX_LEN) {
                let splitIndex = currentText.lastIndexOf(' ', MAX_LEN); 
                if (splitIndex === -1) splitIndex = MAX_LEN; 
                chunks.push(currentText.substring(0, splitIndex) + "...");
                chunks.push("..." + currentText.substring(splitIndex).trim());
            } else {
                chunks.push(currentText);
            }

            breakTimeout1 = setTimeout(() => {
                introEl.style.display = 'none';
                textEl.style.display = 'block';
                
                textEl.textContent = chunks[0];
                textEl.style.animation = 'none';
                textEl.offsetHeight; 
                textEl.style.animation = 'slideUp 0.5s ease-out forwards';

                if (chunks.length > 1) {
                    breakTimeout2 = setTimeout(() => {
                        textEl.style.animation = 'none';
                        textEl.offsetHeight; 
                        textEl.textContent = chunks[1];
                        textEl.style.animation = 'slideUp 0.5s ease-out forwards';
                    }, 4000);
                }
            }, 2000); 
        }

        function startImageSlider() {
            const sliderImg = document.getElementById('top-slide-img'); const sliderContainer = document.getElementById('top-image-slider');
            if (!sliderImg || !sliderContainer) return;
            if (!data.sliderPlaylist || data.sliderPlaylist.length === 0) { sliderContainer.style.display = 'none'; return; }
            sliderContainer.style.display = data.settings && !data.settings.show_promo ? 'none' : 'block';
            if (imageSliderInterval) clearInterval(imageSliderInterval);
            imageSlideIndex = 0;
            const updateImage = () => {
                sliderImg.src = data.sliderPlaylist[imageSlideIndex].image;
                sliderImg.style.animation = 'none'; sliderImg.offsetHeight; sliderImg.style.animation = 'fadeInOut 10s infinite';
                imageSlideIndex = (imageSlideIndex + 1) % data.sliderPlaylist.length;
            };
            updateImage(); imageSliderInterval = setInterval(updateImage, 10000); 
        }

        function resizeOverlay() {
            const wrapper = document.querySelector('.player-wrapper');
            const scaler = document.getElementById('overlay-scaler');
            if(wrapper && scaler) {
                const scale = wrapper.clientWidth / 1920;
                scaler.style.transform = `scale(${scale})`;
            }
        }
        window.addEventListener('resize', resizeOverlay);

        function applyOverlaySettings() {
            if (!data.settings) return;
            const s = data.settings;

            const logoNews = document.getElementById('logo1'); 
            if(logoNews) { 
                if(s.logo_news_url) logoNews.src = s.logo_news_url; 
                logoNews.style.display = s.show_logo_news ? 'block' : 'none'; 
                logoNews.style.transform = `translate(${s.logo1_x || 0}px, ${s.logo1_y || 0}px)`;
            }
            
            const logoChannel = document.getElementById('logo'); 
            if(logoChannel) { 
                if(s.logo_channel_url) logoChannel.src = s.logo_channel_url; 
                logoChannel.style.display = s.show_logo_channel ? 'block' : 'none'; 
                logoChannel.style.transform = `translate(${s.logo_x || 0}px, ${s.logo_y || 0}px)`;
            }
            
            const promoSlider = document.getElementById('top-image-slider'); 
            if(promoSlider && data.sliderPlaylist.length > 0) {
                promoSlider.style.display = s.show_promo ? 'block' : 'none';
                promoSlider.style.transform = `translateY(${s.slider_y || 0}px)`; 
            }

            const clock = document.getElementById('clock-container'); 
            if(clock) {
                clock.style.display = s.show_clock ? 'flex' : 'none';
            }
            
            const rowBreaking = document.getElementById('row-breaking');
            if(rowBreaking) {
                rowBreaking.style.display = s.show_breaking ? 'flex' : 'none';
                rowBreaking.style.transform = `translateY(${s.ticker1_y || 0}px)`;
            }

            const rowApts = document.getElementById('row-apts');
            if(rowApts) {
                rowApts.style.display = s.show_apts ? 'flex' : 'none';
                rowApts.style.transform = `translateY(${s.ticker2_y || 0}px)`;
            }

            const rowAdvt = document.getElementById('row-advt');
            if(rowAdvt) {
                rowAdvt.style.display = s.show_advt ? 'flex' : 'none';
                rowAdvt.style.transform = `translateY(${s.ticker3_y || 0}px)`;
            }
            
            resizeOverlay();
        }

        async function loadPlaylist() {
            try {
                const [urlsRes, aptsRes, advtRes, sliderRes, imgSliderRes, settingsRes, opRes] = await Promise.all([
                    db.from('url_playlist').select('*').eq('operator_code', OPERATOR_CODE).order('id', { ascending: true }),
                    db.from('apts_text').select('*').eq('operator_code', OPERATOR_CODE).order('id', { ascending: true }), 
                    db.from('advt_text').select('*').eq('operator_code', OPERATOR_CODE).order('id', { ascending: true }),
                    db.from('slider_text').select('*').eq('operator_code', OPERATOR_CODE).order('id', { ascending: true }),
                    db.from('slider_playlist').select('*').eq('operator_code', OPERATOR_CODE).order('id', { ascending: true }),
                    db.from('overlay_settings').select('*').eq('operator_code', OPERATOR_CODE).maybeSingle(),
                    db.from('operators').select('*').eq('code', OPERATOR_CODE).maybeSingle()
                ]);

                if (!opRes.data || new Date(opRes.data.expires_at) < new Date()) {
                    document.body.innerHTML = `
                        <div style="display:flex; justify-content:center; align-items:center; height:100vh; background:#000; color:#fff; font-family:sans-serif;">
                            <div style="text-align:center;"><h1 style="color:#ff4444;">CHANNEL OFFLINE</h1><p style="color:#aaa;">This broadcast is temporarily unavailable.</p></div>
                        </div>`;
                    return;
                }

                data.urlPlaylist = urlsRes.data || []; data.aptsText = aptsRes.data || []; data.advtText = advtRes.data || [];
                data.sliderText = sliderRes.data || []; data.sliderPlaylist = imgSliderRes.data || []; data.settings = settingsRes.data || null;
                updateMarquees(); startImageSlider(); startSynchronizedSliders(); applyOverlaySettings(); scheduleVideo(); 
            } catch (err) { console.error('Failed to load data:', err); }
        }

        function updateMarquees() {
            const mainMarquee = document.querySelector('.marquee');
            if (mainMarquee && data.aptsText.length > 0) { 
                let m = ''; 
                data.aptsText.forEach(item => { m += item.text + "&nbsp;&nbsp;&nbsp;&nbsp; &bull; &nbsp;&nbsp;&nbsp;&nbsp;"; }); 
                mainMarquee.innerHTML = m; 
            }
            const subMarquee = document.querySelector('.marquee-sub');
            if (subMarquee && data.advtText.length > 0) { 
                let s = ''; 
                data.advtText.forEach(item => { s += item.text + "&nbsp;&nbsp;&nbsp;&nbsp; &bull; &nbsp;&nbsp;&nbsp;&nbsp;"; }); 
                subMarquee.innerHTML = s; 
            }
        }

        function timeToSec(t) { if (!t) return 0; const [h, m, s] = t.split(':').map(Number); return (h * 3600) + (m * 60) + s; }

        function scheduleVideo() {
            if (!data.urlPlaylist || data.urlPlaylist.length === 0) return;
            const currentSec = timeToSec(new Date().toTimeString().slice(0, 8)); 
            
            let matchedIndex = -1; 
            let offsetSeconds = 0; 
            
            for (let i = 0; i < data.urlPlaylist.length; i++) {
                const item = data.urlPlaylist[i]; 
                const startSec = timeToSec(item.start); 
                const endSec = timeToSec(item.end);
                
                if (startSec <= endSec) {
                    if (currentSec >= startSec && currentSec < endSec) { 
                        matchedIndex = i; offsetSeconds = currentSec - startSec; break; 
                    }
                } else {
                    if (currentSec >= startSec || currentSec < endSec) { 
                        matchedIndex = i; offsetSeconds = currentSec >= startSec ? currentSec - startSec : (currentSec + 86400) - startSec; break; 
                    }
                }
            }

            if (matchedIndex === -1) {
                let totalDuration = 0;
                const durations = data.urlPlaylist.map(item => {
                    const d = timeToSec(item.duration) || 0;
                    totalDuration += d;
                    return d;
                });

                if (totalDuration > 0) {
                    const playTime = currentSec % totalDuration;
                    let runningSum = 0;
                    for (let i = 0; i < data.urlPlaylist.length; i++) {
                        let vidDur = durations[i];
                        if (playTime >= runningSum && playTime < runningSum + vidDur) {
                            matchedIndex = i;
                            offsetSeconds = playTime - runningSum;
                            break;
                        }
                        runningSum += vidDur;
                    }
                }
            }
            
            if (matchedIndex !== -1 && matchedIndex !== currentVideoIndex) {
                currentVideoIndex = matchedIndex; 
                const videoUrl = data.urlPlaylist[matchedIndex].url; 
                let fullUrl = videoUrl;
                
                const ytMatch = videoUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&#?]+)/);
                if (ytMatch && ytMatch[1] && ytMatch[1].length === 11) {
                    fullUrl = `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&start=${Math.floor(offsetSeconds)}`;
                } else {
                    const sep = videoUrl.includes('?') ? '&' : '?';
                    fullUrl += `${sep}autoplay=1#t=${Math.floor(offsetSeconds)}`;
                }
                
                const player = document.getElementById('video-player'); 
                if (player) player.src = fullUrl;
            }
        }

        let isShowingDate = false;
        function updateDisplay() {
            const displayElement = document.getElementById('display'); if (!displayElement) return;
            displayElement.style.opacity = 0;
            setTimeout(() => {
                const now = new Date();
                if (isShowingDate) {
                    let hours = now.getHours(); const minutes = String(now.getMinutes()).padStart(2, '0');
                    displayElement.textContent = `${hours % 12 || 12}:${minutes} ${hours >= 12 ? 'PM' : 'AM'}`; 
                } else {
                    displayElement.textContent = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()}`;
                }
                isShowingDate = !isShowingDate; displayElement.style.opacity = 1;
            }, 500); 
        }

        async function init() {
            if (document.getElementById('display')) document.getElementById('display').textContent = "00:00 AM";
            updateDisplay(); setInterval(updateDisplay, 8000); 
            await loadPlaylist(); setInterval(loadPlaylist, 5 * 60 * 1000); setInterval(scheduleVideo, 1000); 
            resizeOverlay();
        }

        $(window).on('dblclick', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); });
        window.onload = init;
    </script>
</body>
</html>
