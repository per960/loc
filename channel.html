<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MY TV - Playout</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        :root { --primary-bg: #000000; --text-light: #ffffff; --font-main: 'Roboto', sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--primary-bg); width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: var(--font-main); overflow: hidden !important; touch-action: none; }
        main { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .player-wrapper { position: relative; width: 100%; height: 100%; max-width: calc(100vh * (16 / 9)); max-height: calc(100vw * (9 / 16)); background-color: #000; overflow: hidden; aspect-ratio: 16 / 9; }
        
        #yt-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: none; pointer-events: none; }
        #yt-wrapper iframe { width: 100%; height: 100%; border: none; }
        
        #html5-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 1; object-fit: fill; display: none; background: #000; pointer-events: none; }

        #overlay-scaler { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform-origin: top left; pointer-events: none; z-index: 10; }
        #top-image-slider { position: absolute; top: 0; left: 0; width: 100%; height: 160px; z-index: 50; background-color: transparent; overflow: hidden; }
        @keyframes fadeInOut { 0%, 5% { opacity: 0; } 15%, 85% { opacity: 1; } 95%, 100% { opacity: 0; } }
        #logo1 { position: absolute; top: 190px; left: 40px; width: 250px; height: 160px; z-index: 10; display: none; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5)); }
        #logo { position: absolute; top: 190px; right: 40px; width: 250px; height: 180px; z-index: 10; display: none; }
        
        .news-broadcaster-container { position: absolute; bottom: 0; left: 0; width: 1920px; height: 1080px; z-index: 20; }
        .news-row { position: absolute; left: 0; width: 100%; display: flex; background-color: transparent; }
        
        #row-apts { bottom: 0px; height: 80px; } 
        #row-breaking { bottom: 80px; height: 110px; } 
        
        .row-left { display: flex; flex-direction: column; width: 280px; flex-shrink: 0; box-shadow: 3px 0 15px rgba(0,0,0,0.6); z-index: 22; background-color: transparent; overflow: hidden; }
        .row-right { display: flex; flex-direction: column; flex-grow: 1; min-width: 0; width: 100%; overflow: hidden; background-color: transparent; }
        #ticker1-container { display: flex; flex-direction: row; width: 100%; height: 110px; background-color: transparent; }
        .ticker-slider { flex-grow: 1; display: flex; align-items: center; padding: 0 30px; color: #ffffff; white-space: nowrap; overflow: hidden; justify-content: center; text-align: center; }
        
        #clock-container { position: absolute; bottom: 80px; right: 0; background-color: transparent; color: #ffffff; display: flex; justify-content: center; align-items: center; padding: 0 20px; white-space: nowrap; overflow: hidden; width: 260px; height: 110px; z-index: 25; }
        #display { font-size: 38px; font-weight: 900; letter-spacing: 1px; transition: opacity 0.5s ease-in-out; }
        
        .breaking-box { position: absolute; bottom: 80px; left: 0; text-align: center; height: 110px; width: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: transparent; color: #ffffff; font-weight: 900; font-size: 32px; letter-spacing: 1px; white-space: pre-wrap; line-height: 1.1; z-index: 25; overflow: hidden; }
        
        .breaking-intro { display: none; width: 100%; text-align: center; font-size: 44px; font-weight: 900; color: #ffffff; letter-spacing: 2px; animation: introFlash 1s infinite alternate; }
        .slider-text { display: none; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; font-size: 40px; font-weight: 900; }
        @keyframes introFlash { 0% { opacity: 1; } 100% { opacity: 0.7; } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        #apts-box { background-color: transparent; color: #000000; font-size: 32px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 80px; white-space: pre-wrap; line-height: 1.1; overflow:hidden;}
        #ticker2-container { background-color: transparent; height: 80px; position: relative; width: 100%; overflow: hidden; display: flex; align-items: center; }
        .custom-scroll-text { position: absolute; white-space: nowrap; will-change: transform; font-weight: 900; }
        @keyframes slideInLeft { 0% { transform: translateX(-100%); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        .animate-left-to-right { animation: slideInLeft 0.5s ease-out forwards; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; }
    </style>
</head>
<body>
    <main>
        <section class="player-wrapper">
            <video id="html5-player" crossorigin="anonymous" autoplay playsinline></video>
            <div id="yt-wrapper"><div id="video-player"></div></div>
            
            <div id="overlay-scaler">
                <div id="top-image-slider">
                    <img id="top-slide-img" style="display:none; width:100%; height:100%; object-fit:fill;" />
                </div>
                
                <div id="logo1">
                    <img id="logo1-img" style="width:100%; height:100%; object-fit:cover; display:none;" />
                </div>

                <div id="logo">
                    <img id="logo-img" style="width:100%; height:100%; object-fit:cover; display:none;" />
                </div>

                <div class="news-broadcaster-container">
                    <div id="breaking-box" class="breaking-box">
                        <div id="brk-text-content">BREAKING NEWS</div>
                        <img id="brk-image" style="display:none; width:100%; height:100%; object-fit:cover;" />
                    </div>
                    
                    <div id="clock-container"><div id="display"></div></div>

                    <div class="news-row" id="row-breaking">
                        <div id="ticker1-container" class="ticker-slider-container" style="position:relative;">
                            <img id="ticker1-bg-img" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; display:none; z-index:0;">
                            <div class="ticker-slider" style="position:relative; z-index:1;">
                                <div id="breaking-intro" class="breaking-intro">&#128680; BREAKING NEWS &#128680;</div>
                                <div id="slider-text-display" class="slider-text"></div>
                            </div>
                        </div>
                    </div>

                    <div class="news-row" id="row-apts">
                        <div class="row-left"><div id="apts-box">NEWS</div></div>
                        <div class="row-right"><div id="ticker2-container"></div></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const supabaseUrl = 'https://jehffxxhrqwnzhkrcbrv.supabase.co';
        const supabaseKey = 'sb_publishable_R-ik0luMifvjFakpfDr3cA_8kIGVVQP';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        let OPERATOR_CODE = "";
        let isOperatorAllowed = true;
        let data = { urlPlaylist: [], aptsText: [], sliderText: [], sliderPlaylist: [], settings: null };
        
        let currentVideoIndex = -1; 
        let isSequentialMode = false;
        let sequentialIndex = 0;
        
        let syncIndex = 0; let syncInterval = null; let imageSlideIndex = 0; let imageSliderInterval = null;
        let breakTimeout1, breakTimeout2; 
        let aptsCurrentIndex = 0; let aptsTickerTimeout = null;
        let displayTimer = null; let playlistReloadTimer = null; let scheduleTimer = null; let checkYtInterval = null;
        let operatorStatusTimer = null;
        
        let hlsInstance = null;
        let ytPlayerInstance = null;
        const html5Player = document.getElementById('html5-player');
        const ytWrapper = document.getElementById('yt-wrapper');
        const playerWrapper = document.querySelector('.player-wrapper');


        function onVideoEnded() {
            if (!isOperatorAllowed) return;
            if (isSequentialMode && data.urlPlaylist && data.urlPlaylist.length > 0) {
                sequentialIndex = (sequentialIndex + 1) % data.urlPlaylist.length;
                playVideoAtIndex(sequentialIndex, 0);
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                onVideoEnded();
            }
        }


        html5Player.addEventListener('ended', onVideoEnded);
        html5Player.addEventListener('error', onVideoEnded);

        function stopActiveMedia() {
            clearTimeout(syncInterval); clearTimeout(breakTimeout1); clearTimeout(breakTimeout2);
            clearTimeout(aptsTickerTimeout); clearTimeout(imageSliderInterval);
            
            if (ytPlayerInstance) {
                try { ytPlayerInstance.destroy(); } catch(e){}
                ytPlayerInstance = null;
            }
            ytWrapper.style.display = 'none';
            ytWrapper.innerHTML = '<div id="video-player"></div>';
            
            if (html5Player) { 
                html5Player.style.display = 'none';
                try {
                    html5Player.pause(); 
                    html5Player.removeAttribute('src'); 
                    html5Player.load();
                } catch(e){}
            }
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            currentVideoIndex = -1;
            isSequentialMode = false;
        }

        async function checkOperatorPermission() {
            if (!OPERATOR_CODE) return false;
            try {
                const { data: opData, error } = await db
                    .from('operators')
                    .select('max_devices, expires_at')
                    .eq('code', OPERATOR_CODE)
                    .maybeSingle();

                if (error || !opData || new Date(opData.expires_at) < new Date()) {
                    setChannelAllowedState(false);
                    return false;
                }

                const maxDevices = (opData.max_devices !== null && opData.max_devices !== undefined) ? opData.max_devices : 1;
                if (maxDevices <= 0) {
                    setChannelAllowedState(false);
                    return false;
                } else {
                    setChannelAllowedState(true);
                    return true;
                }
            } catch (err) {
                return isOperatorAllowed;
            }
        }

        function setChannelAllowedState(allowed) {
            if (!allowed) {
                if (isOperatorAllowed || playerWrapper.style.display !== 'none') {
                    isOperatorAllowed = false;
                    stopActiveMedia();
                    if (playerWrapper) playerWrapper.style.display = 'none';
                }
            } else {
                const wasBlocked = !isOperatorAllowed || playerWrapper.style.display === 'none';
                isOperatorAllowed = true;
                if (playerWrapper) playerWrapper.style.display = 'block';
                if (wasBlocked) {
                    resizeOverlay();
                    updateMarquees();
                    startImageSlider();
                    startSynchronizedSliders();
                    applyOverlaySettings();
                    scheduleVideo();
                }
            }
        }

        window.startPlayout = function(opCode) {
            const newCode = (opCode || "").trim().toUpperCase();
            if (!newCode) return;
            if (OPERATOR_CODE === newCode && scheduleTimer) return;
            if (OPERATOR_CODE) window.stopPlayout();
            OPERATOR_CODE = newCode;
            currentVideoIndex = -1;
            isSequentialMode = false;
            sequentialIndex = 0;
            init();
        };

        window.stopPlayout = function() {
            stopActiveMedia();
            clearInterval(displayTimer); clearInterval(playlistReloadTimer); clearInterval(scheduleTimer); clearInterval(checkYtInterval); clearInterval(operatorStatusTimer);
            displayTimer = null; playlistReloadTimer = null; scheduleTimer = null; checkYtInterval = null; operatorStatusTimer = null;
        };

        function getBg(c1, c2) { return c1 === c2 ? c1 : `linear-gradient(90deg, ${c1}, ${c2})`; }

        function applyMediaLayer(url, imgEl) {
            if (!url) { 
                if(imgEl) imgEl.style.display = 'none'; 
                return; 
            }
            if(imgEl) { 
                imgEl.src = url; 
                imgEl.style.display = 'block'; 
            }
        }

        function startSynchronizedSliders() {
            clearTimeout(syncInterval); clearTimeout(breakTimeout1); clearTimeout(breakTimeout2);
            if (!isOperatorAllowed) return;
            updateSyncedText(); 
        }

        function updateSyncedText() {
            if (!isOperatorAllowed || !data.sliderText || data.sliderText.length === 0) return;
            const currentText = data.sliderText[syncIndex % data.sliderText.length].text;
            syncIndex++;

            const introEl = document.getElementById('breaking-intro');
            const textEl = document.getElementById('slider-text-display');
            introEl.style.display = 'block'; textEl.style.display = 'none';

            let chunks = []; const MAX_LEN = 45; let remainingStr = currentText;
            if (remainingStr.length > MAX_LEN) {
                while(remainingStr.length > MAX_LEN) {
                    let splitIndex = remainingStr.lastIndexOf(' ', MAX_LEN);
                    if (splitIndex === -1) splitIndex = MAX_LEN;
                    chunks.push(remainingStr.substring(0, splitIndex));
                    remainingStr = remainingStr.substring(splitIndex).trim();
                }
                chunks.push(remainingStr);
            } else { chunks.push(remainingStr); }

            breakTimeout1 = setTimeout(() => {
                if (!isOperatorAllowed) return;
                introEl.style.display = 'none'; textEl.style.display = 'block';
                let chunkIdx = 0;
                function showNextChunk() {
                    if (!isOperatorAllowed) return;
                    textEl.textContent = chunks[chunkIdx];
                    textEl.style.animation = 'none'; textEl.offsetHeight; 
                    textEl.style.animation = 'slideUp 0.5s ease-out forwards';
                    chunkIdx++;
                    if(chunkIdx < chunks.length) { breakTimeout2 = setTimeout(showNextChunk, 4000); } 
                    else { syncInterval = setTimeout(updateSyncedText, 4000); }
                }
                showNextChunk();
            }, 2000); 
        }

        function startImageSlider() {
            if (!isOperatorAllowed) return;
            const sliderContainer = document.getElementById('top-image-slider');
            if (!sliderContainer || !data.sliderPlaylist || data.sliderPlaylist.length === 0) return;
            sliderContainer.style.display = data.settings && !data.settings.show_promo ? 'none' : 'block';
            if (imageSliderInterval) clearTimeout(imageSliderInterval);
            imageSlideIndex = 0;
            
            const imgEl = document.getElementById('top-slide-img');

            const updateSlide = () => {
                if (!isOperatorAllowed || !data.sliderPlaylist || data.sliderPlaylist.length === 0) return;
                const mediaUrl = data.sliderPlaylist[imageSlideIndex].image;
                
                imgEl.src = mediaUrl; 
                imgEl.style.display = 'block';
                imgEl.style.animation = 'none'; 
                imgEl.offsetHeight; 
                imgEl.style.animation = 'fadeInOut 10s infinite';
                
                imageSliderInterval = setTimeout(moveToNext, 10000);
            };
            
            const moveToNext = () => { imageSlideIndex = (imageSlideIndex + 1) % data.sliderPlaylist.length; updateSlide(); };
            updateSlide(); 
        }

        function resizeOverlay() {
            const wrapper = document.querySelector('.player-wrapper');
            const scaler = document.getElementById('overlay-scaler');
            if(wrapper && scaler && wrapper.clientWidth > 0) {
                const scale = wrapper.clientWidth / 1920;
                scaler.style.transform = `scale(${scale})`;
            }
        }
        window.addEventListener('resize', resizeOverlay);

        function applyOverlaySettings() {
            if (!data.settings) return;
            const s = data.settings;

            const logoNews = document.getElementById('logo1'); 
            if(logoNews) { 
                logoNews.style.display = s.show_logo_news ? 'block' : 'none'; 
                logoNews.style.transform = `translate(${s.logo1_x || 0}px, ${s.logo1_y || 0}px)`;
                logoNews.style.width = (s.logo1_w || 250) + 'px'; logoNews.style.height = (s.logo1_h || 160) + 'px';
                applyMediaLayer(s.logo_news_url, document.getElementById('logo1-img'));
            }
            
            const logoChannel = document.getElementById('logo'); 
            if(logoChannel) { 
                logoChannel.style.display = s.show_logo_channel ? 'block' : 'none'; 
                logoChannel.style.transform = `translate(${s.logo_x || 0}px, ${s.logo_y || 0}px)`;
                logoChannel.style.width = (s.logo_w || 250) + 'px'; logoChannel.style.height = (s.logo_h || 180) + 'px';
                applyMediaLayer(s.logo_channel_url, document.getElementById('logo-img'));
            }

            const clock = document.getElementById('clock-container'); const clockDisplay = document.getElementById('display');
            if(clock) {
                clock.style.display = s.show_clock ? 'flex' : 'none';
                clock.style.transform = `translate(${s.clock_x || 0}px, ${s.clock_y || 0}px)`;
                if(s.clock_w) clock.style.width = s.clock_w + 'px';
                if(s.clock_h) clock.style.height = s.clock_h + 'px';
                clock.style.background = (!s.bg_clock1 || s.bg_clock1 === 'transparent') ? 'transparent' : getBg(s.bg_clock1, s.bg_clock2);
                if(s.clock_color) clockDisplay.style.color = s.clock_color;
                if(s.clock_size) clockDisplay.style.fontSize = s.clock_size + 'px';
            }
            
            const brkBox = document.getElementById('breaking-box'); const brkTextContent = document.getElementById('brk-text-content');
            if(brkBox) {
                brkBox.style.display = s.show_breaking ? 'flex' : 'none'; 
                brkBox.style.transform = `translate(${s.brk_box_x || 0}px, ${s.brk_box_y || 0}px)`;
                if(s.brk_box_w) brkBox.style.width = s.brk_box_w + 'px';
                if(s.brk_box_h) brkBox.style.height = s.brk_box_h + 'px';
                brkBox.style.background = (!s.bg_brk_1 || s.bg_brk_1 === 'transparent') ? 'transparent' : getBg(s.bg_brk_1, s.bg_brk_2);
                if(s.brk_box_size) brkBox.style.fontSize = s.brk_box_size + 'px';
                if(s.brk_box_color) brkBox.style.color = s.brk_box_color;
                if (s.brk_box_media && s.brk_box_media.trim() !== '') {
                    brkTextContent.style.display = 'none';
                    applyMediaLayer(s.brk_box_media, document.getElementById('brk-image'));
                } else {
                    brkTextContent.innerHTML = s.lbl_break || 'BREAKING\nNEWS'; brkTextContent.style.display = 'block';
                    applyMediaLayer(null, document.getElementById('brk-image'));
                }
            }

            const rowBreaking = document.getElementById('row-breaking'); const breakingText = document.getElementById('slider-text-display');
            const breakingIntro = document.getElementById('breaking-intro'); const ticker1Container = document.getElementById('ticker1-container');
            if(rowBreaking) {
                rowBreaking.style.display = s.show_breaking ? 'flex' : 'none';
                rowBreaking.style.transform = `translate(${s.ticker1_x || 0}px, ${s.ticker1_y || 0}px)`;
                if(s.row1_w) rowBreaking.style.width = s.row1_w + 'px';
                if(s.row1_h) { rowBreaking.style.height = s.row1_h + 'px'; ticker1Container.style.height = s.row1_h + 'px'; }
                ticker1Container.style.background = (!s.bg_tick1_1 || s.bg_tick1_1 === 'transparent') ? 'transparent' : getBg(s.bg_tick1_1, s.bg_tick1_2);
                if(s.ticker1_media && s.ticker1_media.trim() !== '') {
                    ticker1Container.style.background = 'transparent';
                    applyMediaLayer(s.ticker1_media, document.getElementById('ticker1-bg-img'));
                } else { applyMediaLayer(null, document.getElementById('ticker1-bg-img')); }
                if(s.ticker1_color && breakingText) breakingText.style.color = s.ticker1_color; 
                if(s.ticker1_size && breakingText) breakingText.style.fontSize = s.ticker1_size + 'px'; 
                if(s.intro_size && breakingIntro) breakingIntro.style.fontSize = s.intro_size + 'px';
                if(s.intro_color && breakingIntro) breakingIntro.style.color = s.intro_color;
                if(s.lbl_intro && breakingIntro) breakingIntro.innerHTML = s.lbl_intro; 
            }

            const rowApts = document.getElementById('row-apts'); const ticker2Container = document.getElementById('ticker2-container');
            const aptsBox = document.getElementById('apts-box'); const r2Left = rowApts ? rowApts.querySelector('.row-left') : null;
            if(rowApts) {
                rowApts.style.display = s.show_apts ? 'flex' : 'none';
                rowApts.style.transform = `translate(${s.ticker2_x || 0}px, ${s.ticker2_y || 0}px)`;
                if(s.row2_w) rowApts.style.width = s.row2_w + 'px';
                if(r2Left && s.apts_box_w) r2Left.style.width = s.apts_box_w + 'px';
                if(s.row2_h) { rowApts.style.height = s.row2_h + 'px'; ticker2Container.style.height = s.row2_h + 'px'; aptsBox.style.height = s.row2_h + 'px'; }
                ticker2Container.style.background = (!s.bg_tick2_1 || s.bg_tick2_1 === 'transparent') ? 'transparent' : getBg(s.bg_tick2_1, s.bg_tick2_2);
                aptsBox.style.background = (!s.bg_apts_1 || s.bg_apts_1 === 'transparent') ? 'transparent' : getBg(s.bg_apts_1, s.bg_apts_2);
                if(s.apts_box_size) aptsBox.style.fontSize = s.apts_box_size + 'px';
                if(s.apts_box_color) aptsBox.style.color = s.apts_box_color;
            }
            resizeOverlay();
        }

        async function loadPlaylist() {
            try {
                const allowed = await checkOperatorPermission();
                if (!allowed) return;

                const [urlsRes, aptsRes, sliderRes, imgSliderRes, settingsRes] = await Promise.all([
                    db.from('url_playlist').select('*').eq('operator_code', OPERATOR_CODE).order('id', { ascending: true }),
                    db.from('apts_text').select('*').eq('operator_code', OPERATOR_CODE).order('id', { ascending: true }), 
                    db.from('slider_text').select('*').eq('operator_code', OPERATOR_CODE).order('id', { ascending: true }),
                    db.from('slider_playlist').select('*').eq('operator_code', OPERATOR_CODE).order('id', { ascending: true }),
                    db.from('overlay_settings').select('*').eq('operator_code', OPERATOR_CODE).maybeSingle()
                ]);

                data.urlPlaylist = urlsRes.data || []; data.aptsText = aptsRes.data || []; 
                data.sliderText = sliderRes.data || []; data.sliderPlaylist = imgSliderRes.data || []; data.settings = settingsRes.data || null;
                
                updateMarquees(); startImageSlider(); startSynchronizedSliders(); applyOverlaySettings(); 
                scheduleVideo(); 
            } catch (err) {}
        }

        function startAptsTicker() {
            clearTimeout(aptsTickerTimeout);
            if (!isOperatorAllowed) return;
            const tickerContainer = document.getElementById('ticker2-container');
            const aptsBox = document.getElementById('apts-box');
            if (!data.aptsText || data.aptsText.length === 0) { tickerContainer.innerHTML = ''; return; }
            if (aptsCurrentIndex >= data.aptsText.length) aptsCurrentIndex = 0;
            const currentItem = data.aptsText[aptsCurrentIndex];
            let category = (data.settings && data.settings.lbl_news2) ? data.settings.lbl_news2 : 'NEWS';
            if (currentItem.category && currentItem.category.trim() !== '') category = currentItem.category;

            aptsBox.innerHTML = `<div class="animate-left-to-right">${category}</div>`;
            tickerContainer.innerHTML = '';
            const scrollDiv = document.createElement('div');
            scrollDiv.className = 'custom-scroll-text'; scrollDiv.innerHTML = currentItem.text;
            const s = data.settings;
            if(s && s.ticker2_color) scrollDiv.style.color = s.ticker2_color;
            if(s && s.ticker2_size) scrollDiv.style.fontSize = s.ticker2_size + 'px';
            tickerContainer.appendChild(scrollDiv);

            const speed = (s && s.scroll_main) ? s.scroll_main : 10;
            const containerWidth = tickerContainer.clientWidth || 1640; 
            const textWidth = scrollDiv.clientWidth;
            const totalDistance = containerWidth + textWidth;
            const duration = totalDistance / (speed * 40);

            scrollDiv.style.transition = 'none'; scrollDiv.style.transform = `translateX(${containerWidth}px)`;
            scrollDiv.offsetHeight; scrollDiv.style.transition = `transform ${duration}s linear`;
            scrollDiv.style.transform = `translateX(-${textWidth}px)`;

            aptsTickerTimeout = setTimeout(() => { aptsCurrentIndex++; startAptsTicker(); }, duration * 1000);
        }

        function updateMarquees() {
            startAptsTicker();
        }

        function timeToSec(t) { if (!t) return 0; const [h, m, s] = t.split(':').map(Number); return (h * 3600) + (m * 60) + s; }

        function playVideoAtIndex(index, offsetSeconds) {
            if (!isOperatorAllowed) return;
            currentVideoIndex = index;
            const videoUrl = data.urlPlaylist[index].url;
            let videoId = null; let playlistId = null;
            let isYouTube = false;

            try {
                let ytMatch = videoUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|live\/|shorts\/|watch\?v=))([^&#?]+)/);
                if (ytMatch && ytMatch[1]) { videoId = ytMatch[1]; isYouTube = true; }
                let parsed = new URL(videoUrl);
                if (parsed.searchParams.has('v')) { videoId = parsed.searchParams.get('v'); isYouTube = true; }
                if (parsed.searchParams.has('list')) { playlistId = parsed.searchParams.get('list'); isYouTube = true; }
            } catch(e){}


            if (isYouTube) {

                html5Player.style.display = 'none';
                try {
                    html5Player.pause();
                    html5Player.removeAttribute('src'); 
                    html5Player.load(); 
                } catch(e) {}
                if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

        
                ytWrapper.style.display = 'block';
                if (typeof YT !== 'undefined' && YT.Player) {
                    if (!ytPlayerInstance) {
                        ytPlayerInstance = new YT.Player('video-player', {
                            videoId: videoId || '',
                            playerVars: { 'autoplay': 1, 'controls': 0, 'modestbranding': 1, 'rel': 0, 'playsinline': 1, 'start': Math.floor(offsetSeconds), 'list': playlistId || '' },
                            events: { 'onStateChange': onPlayerStateChange, 'onError': onVideoEnded }
                        });
                    } else {
                        if (playlistId && !videoId) ytPlayerInstance.loadPlaylist({list: playlistId, index: 0, startSeconds: offsetSeconds});
                        else ytPlayerInstance.loadVideoById({videoId: videoId, startSeconds: offsetSeconds});
                    }
                }
            } else {
                
                ytWrapper.style.display = 'none';
                if (ytPlayerInstance) {
                    try { ytPlayerInstance.destroy(); } catch(e) {}
                    ytPlayerInstance = null;
                }
                
                ytWrapper.innerHTML = '<div id="video-player"></div>';

            
                html5Player.style.display = 'block';
                const isM3u8 = videoUrl.toLowerCase().includes('.m3u8');
                
                if (isM3u8 && typeof Hls !== 'undefined' && Hls.isSupported()) {
                    if (hlsInstance) hlsInstance.destroy();
                    hlsInstance = new Hls({ startPosition: offsetSeconds, enableWorker: true });
                    hlsInstance.loadSource(videoUrl);
                    hlsInstance.attachMedia(html5Player);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() { html5Player.play().catch(()=>{}); });
                    hlsInstance.on(Hls.Events.ERROR, function(e, d) { if(d.fatal) onVideoEnded(); });
                } else {
                    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
                    html5Player.src = videoUrl;
                    html5Player.currentTime = offsetSeconds;
                    html5Player.play().catch(()=>{});
                }
            }
        }

        function scheduleVideo() {
            if (!isOperatorAllowed || !data.urlPlaylist || data.urlPlaylist.length === 0) return;
            const currentSec = timeToSec(new Date().toTimeString().slice(0, 8)); 
            
            let matchedIndex = -1; 
            let offsetSeconds = 0; 
            
            
            for (let i = 0; i < data.urlPlaylist.length; i++) {
                const item = data.urlPlaylist[i]; 
                const startSec = timeToSec(item.start); 
                const endSec = timeToSec(item.end);
                
                if (startSec === 0 && endSec === 0) continue; 
                
                if (startSec < endSec) {
                    if (currentSec >= startSec && currentSec < endSec) { matchedIndex = i; offsetSeconds = currentSec - startSec; break; }
                } else if (startSec > endSec) {
                    if (currentSec >= startSec || currentSec < endSec) { matchedIndex = i; offsetSeconds = currentSec >= startSec ? currentSec - startSec : (currentSec + 86400) - startSec; break; }
                }
            }

            
            if (matchedIndex !== -1) {
                
                isSequentialMode = false;
                if (matchedIndex !== currentVideoIndex) {
                    playVideoAtIndex(matchedIndex, offsetSeconds);
                }
            } else {
                
                if (!isSequentialMode) {
                    isSequentialMode = true;
                    if (currentVideoIndex === -1) currentVideoIndex = 0;
                    sequentialIndex = currentVideoIndex;
                    playVideoAtIndex(sequentialIndex, 0);
                }
            }
        }

        let isShowingDate = false;
        function updateDisplay() {
            const displayElement = document.getElementById('display'); if (!displayElement) return;
            displayElement.style.opacity = 0;
            setTimeout(() => {
                const now = new Date();
                if (isShowingDate) {
                    let hours = now.getHours(); const minutes = String(now.getMinutes()).padStart(2, '0');
                    displayElement.textContent = `${hours % 12 || 12}:${minutes} ${hours >= 12 ? 'PM' : 'AM'}`; 
                } else {
                    displayElement.textContent = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()}`;
                }
                isShowingDate = !isShowingDate; displayElement.style.opacity = 1;
            }, 500); 
        }

        async function init() {
            if (document.getElementById('display')) document.getElementById('display').textContent = "00:00 AM";
            updateDisplay(); 
            displayTimer = setInterval(updateDisplay, 8000); 
            operatorStatusTimer = setInterval(checkOperatorPermission, 10000);
            
            checkYtInterval = setInterval(async () => {
                if (typeof YT !== 'undefined' && YT.Player) {
                    clearInterval(checkYtInterval);
                    checkYtInterval = null;
                    await loadPlaylist(); 
                    playlistReloadTimer = setInterval(loadPlaylist, 5 * 60 * 1000); 
                    scheduleTimer = setInterval(scheduleVideo, 1000); 
                    resizeOverlay();
                }
            }, 200);
        }

        function checkUrlCode() {
            const params = new URLSearchParams(window.location.search);
            const urlCode = params.get('code') || params.get('op');
            if (urlCode) {
                window.startPlayout(urlCode);
            } else {
                setChannelAllowedState(false);
            }
        }

        window.addEventListener('DOMContentLoaded', checkUrlCode);
        window.addEventListener('popstate', checkUrlCode);
        window.addEventListener('hashchange', checkUrlCode);
    </script>
</body>
